<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Digital</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            width: 100%;
            overflow-y: scroll;
            /* Menggunakan proximity agar transisi scroll terasa mengalir bertahap ala presentasi */
            scroll-snap-type: y proximity;
            background-color: #000;
        }
        .slide {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            position: relative;
            background-color: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .map-link-area {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;  
            height: 55px; 
            z-index: 10;
            cursor: pointer;
        }
        /* Tombol interaksi awal untuk memancing musik agar mau nyala di HP */
        #play-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }
        .play-box {
            background: #28a745;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- Tombol layar sentuh pertama untuk memastikan musik menyala normal di semua HP -->
    <div id="play-overlay" onclick="startExperience()">
        <div class="play-box">Buka Undangan 🎵</div>
    </div>

    <!-- Slide 1 -->
    <div class="slide">
        <video src="Slide1.mp4" autoplay muted loop playsinline preload="auto"></video>
    </div>

    <!-- Slide 2 -->
    <div class="slide">
        <video src="Slide2.mp4" autoplay muted loop playsinline preload="auto"></video>
    </div>

    <!-- Slide 3 -->
    <div class="slide">
        <video src="Slide3.mp4" autoplay muted loop playsinline preload="auto"></video>
    </div>

    <!-- Slide 4 -->
    <div class="slide">
        <video src="Slide4.mp4" autoplay muted loop playsinline preload="auto"></video>
    </div>

    <!-- Slide 5 (Google Maps Aktif) -->
    <div class="slide">
        <video src="Slide5.mp4" autoplay muted loop playsinline preload="auto"></video>
        <a href="https://maps.app.goo.gl/bvZLtwJx3cSZKvf46" target="_blank" class="map-link-area"></a>
    </div>

    <!-- Slide 6 (Google Maps Aktif) -->
    <div class="slide">
        <video src="Slide6.mp4" autoplay muted loop playsinline preload="auto"></video>
        <a href="https://maps.app.goo.gl/bvZLtwJx3cSZKvf46" target="_blank" class="map-link-area"></a>
    </div>

    <!-- Slide 7 -->
    <div class="slide">
        <video src="Slide7.mp4" autoplay muted loop playsinline preload="auto"></video>
    </div>

    <!-- Slide 8 -->
    <div class="slide">
        <video src="Slide8.mp4" autoplay muted loop playsinline preload="auto"></video>
    </div>

    <!-- Audio Musik Latar -->
    <audio id="bgMusic" src="music.mp3" loop></audio>

    <script>
        const bgMusic = document.getElementById('bgMusic');
        const overlay = document.getElementById('play-overlay');

        function startExperience() {
            bgMusic.play().then(() => {
                // Hilangkan kotak overlay setelah diklik agar tamu bisa langsung scroll
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 500);
            }).catch(err => {
                console.log("Gagal memutar musik:", err);
            });
        }

        // Musik berhenti otomatis saat keluar web atau pindah tab
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                bgMusic.pause();
            } else if (overlay.style.display === 'none') {
                bgMusic.play().catch(() => {});
            }
        });
    </script>
</body>
</html>
