<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Digital</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            width: 100%;
            background-color: #000;
        }
        /* Menggunakan tinggi total 8 slide agar halaman bisa di-scroll secara halus per milimeter */
        .scroll-container {
            height: 800vh;
            position: relative;
        }
        .sticky-container {
            position: sticky;
            top: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #000;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        video.active {
            display: block;
        }
        .map-link-area {
            position: absolute;
            bottom: 12%; 
            width: 60%;  
            height: 55px; 
            z-index: 10;
            cursor: pointer;
            display: none;
        }
        .map-link-area.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="scroll-container">
        <div class="sticky-container">
            <!-- Video Slide 1-8 -->
            <video id="vid1" src="Slide1.mp4" muted playsinline preload="auto"></video>
            <video id="vid2" src="Slide2.mp4" muted playsinline preload="auto"></video>
            <video id="vid3" src="Slide3.mp4" muted playsinline preload="auto"></video>
            <video id="vid4" src="Slide4.mp4" muted playsinline preload="auto"></video>
            
            <video id="vid5" src="Slide5.mp4" muted playsinline preload="auto"></video>
            <a href="https://maps.app.goo.gl/bvZLtwJx3cSZKvf46" target="_blank" class="map-link-area" id="map5"></a>

            <video id="vid6" src="Slide6.mp4" muted playsinline preload="auto"></video>
            <a href="https://maps.app.goo.gl/bvZLtwJx3cSZKvf46" target="_blank" class="map-link-area" id="map6"></a>

            <video id="vid7" src="Slide7.mp4" muted playsinline preload="auto"></video>
            <video id="vid8" src="Slide8.mp4" muted playsinline preload="auto"></video>
        </div>
    </div>

    <!-- Audio Musik Latar -->
    <audio id="bgMusic" src="music.mp3" loop></audio>

    <script>
        const videos = [
            document.getElementById('vid1'),
            document.getElementById('vid2'),
            document.getElementById('vid3'),
            document.getElementById('vid4'),
            document.getElementById('vid5'),
            document.getElementById('vid6'),
            document.getElementById('vid7'),
            document.getElementById('vid8')
        ];

        const maps = [
            null, null, null, null,
            document.getElementById('map5'),
            document.getElementById('map6'),
            null, null
        ];

        const bgMusic = document.getElementById('bgMusic');
        let musicStarted = false;

        function updateVideoOnScroll() {
            const scrollTop = window.scrollY;
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            const scrollFraction = scrollTop / maxScroll;
            
            // Menentukan slide aktif (0 sampai 7) berdasarkan posisi scroll tangan
            let currentIndex = Math.floor(scrollFraction * videos.length);
            if (currentIndex >= videos.length) currentIndex = videos.length - 1;
            if (currentIndex < 0) currentIndex = 0;

            // Hitung progres di dalam slide tersebut (0.0 sampai 1.0)
            const slideProgress = (scrollFraction * videos.length) - currentIndex;

            videos.forEach((vid, index) => {
                if (index === currentIndex) {
                    vid.classList.add('active');
                    // Menyesuaikan detik video persis mengikuti seberapa jauh scroll tangan
                    if (vid.duration) {
                        vid.currentTime = slideProgress * vid.duration;
                    }
                } else {
                    vid.classList.remove('active');
                }
            });

            maps.forEach((map, index) => {
                if (map) {
                    if (index === currentIndex) {
                        map.classList.add('active');
                    } else {
                        map.classList.remove('active');
                    }
                }
            });

            // Musik otomatis menyala saat ada gerakan scrolling pertama kali
            if (!musicStarted && scrollTop > 5) {
                bgMusic.play().then(() => {
                    musicStarted = true;
                }).catch(() => {});
            }
        }

        window.addEventListener('scroll', updateVideoOnScroll);
        window.addEventListener('load', updateVideoOnScroll);

        // Musik otomatis berhenti/pause saat halaman ditutup atau ditinggal keluar web
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                bgMusic.pause();
            } else if (musicStarted) {
                bgMusic.play().catch(() => {});
            }
        });
    </script>
</body>
</html>
