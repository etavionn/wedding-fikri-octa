<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Digital</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            width: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            background-color: #000;
        }
        .slide {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            position: relative;
            background-color: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .map-link-area {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;  
            height: 55px; 
            z-index: 10;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Slide 1 -->
    <div class="slide">
        <video src="Slide1.mp4" autoplay muted loop playsinline preload="auto"></video>
    </div>

    <!-- Slide 2 -->
    <div class="slide">
        <video src="Slide2.mp4" autoplay muted loop playsinline preload="auto"></video>
    </div>

    <!-- Slide 3 -->
    <div class="slide">
        <video src="Slide3.mp4" autoplay muted loop playsinline preload="auto"></video>
    </div>

    <!-- Slide 4 -->
    <div class="slide">
        <video src="Slide4.mp4" autoplay muted loop playsinline preload="auto"></video>
    </div>

    <!-- Slide 5 (Ada Tombol Google Maps) -->
    <div class="slide">
        <video src="Slide5.mp4" autoplay muted loop playsinline preload="auto"></video>
        <a href="https://maps.app.goo.gl/bvZLtwJx3cSZKvf46" target="_blank" class="map-link-area"></a>
    </div>

    <!-- Slide 6 (Ada Tombol Google Maps) -->
    <div class="slide">
        <video src="Slide6.mp4" autoplay muted loop playsinline preload="auto"></video>
        <a href="https://maps.app.goo.gl/bvZLtwJx3cSZKvf46" target="_blank" class="map-link-area"></a>
    </div>

    <!-- Slide 7 -->
    <div class="slide">
        <video src="Slide7.mp4" autoplay muted loop playsinline preload="auto"></video>
    </div>

    <!-- Slide 8 -->
    <div class="slide">
        <video src="Slide8.mp4" autoplay muted loop playsinline preload="auto"></video>
    </div>

    <!-- Audio Musik Latar -->
    <audio id="bgMusic" src="music.mp3" loop></audio>

    <script>
        const bgMusic = document.getElementById('bgMusic');
        let musicStarted = false;

        // Musik menyala otomatis saat ada interaksi scroll pertama kali di layar
        window.addEventListener('scroll', () => {
            if (!musicStarted && window.scrollY > 10) {
                bgMusic.play().then(() => {
                    musicStarted = true;
                }).catch(() => {});
            }
        }, { once: true });

        // Musik berhenti otomatis saat keluar web atau pindah tab
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                bgMusic.pause();
            } else if (musicStarted) {
                bgMusic.play().catch(() => {});
            }
        });
    </script>
</body>
</html>
